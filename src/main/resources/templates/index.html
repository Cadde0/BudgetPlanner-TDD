<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Planner</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #1f2937;
        --text-muted: #526074;
        --border: #d8e1ea;
        --primary: #1769aa;
        --primary-dark: #14588e;
        --secondary: #6b7f95;
        --secondary-dark: #5a6d81;
        --danger: #b83232;
        --radius: 12px;
        --shadow: 0 12px 32px rgba(8, 34, 64, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans", "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 0 1rem 2rem;
        background: radial-gradient(circle at top, #eef5ff 0%, var(--bg) 45%);
        color: var(--text);
        line-height: 1.45;
      }

      header {
        background: linear-gradient(120deg, #0f5f96, var(--primary));
        color: #f8fbff;
        padding: 1.5rem 1rem;
        text-align: center;
        font-size: clamp(1.8rem, 2.4vw, 2.4rem);
        letter-spacing: 0.03em;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      }

      main {
        max-width: 980px;
        margin: 1.5rem auto;
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: clamp(1rem, 2vw, 2rem);
      }

      h2,
      h3,
      h4 {
        margin: 0 0 0.75rem;
        color: #153a5b;
      }

      h2 {
        font-size: 1.4rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.45rem;
      }

      h3 {
        font-size: 1.2rem;
      }

      h4 {
        font-size: 1.02rem;
        color: var(--text-muted);
      }

      form,
      .category-block {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.6rem;
        align-items: end;
        margin-bottom: 0.7rem;
      }

      label {
        display: block;
        font-weight: 600;
        font-size: 0.94rem;
        color: #24364a;
      }

      input,
      select,
      button {
        width: 100%;
        min-height: 38px;
        font: inherit;
        border-radius: 8px;
      }

      input,
      select {
        border: 1px solid var(--border);
        background: #fff;
        padding: 0.45rem 0.55rem;
        color: var(--text);
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(23, 105, 170, 0.2);
        border-color: var(--primary);
      }

      button {
        border: none;
        background: var(--primary);
        color: #fff;
        padding: 0.5rem 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        background: var(--secondary);
      }

      .btn-secondary:hover {
        background: var(--secondary-dark);
      }

      .btn-danger {
        background: var(--danger);
      }

      .btn-danger:hover {
        background: #972a2a;
      }

      td button {
        width: auto;
        min-height: 32px;
        padding: 0.35rem 0.65rem;
      }

      td select {
        width: auto;
        min-height: 32px;
        max-width: 170px;
        margin-right: 0.35rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
        background: var(--surface-soft);
      }

      .table-wrap {
        margin-top: 0.6rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: auto;
        max-height: 340px;
        background: #fff;
      }

      th,
      td {
        border: 1px solid var(--border);
        padding: 0.72rem 0.6rem;
        text-align: center;
      }

      th {
        background: #e8f0f8;
        color: #1d3f60;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      .feedback {
        margin-top: 0.55rem;
        color: #1f4e78;
        min-height: 1.2rem;
        font-size: 0.94rem;
      }

      .section-divider {
        margin: 1.6rem 0;
        border: none;
        border-top: 1px solid var(--border);
      }

      @media (max-width: 700px) {
        body {
          padding: 0 0.55rem 1rem;
        }

        main {
          border-radius: 10px;
          padding: 0.9rem;
        }

        th,
        td {
          font-size: 0.86rem;
          padding: 0.45rem;
        }
      }
    </style>
  </head>
  <body>
    <header>Budget Planner</header>
    <main>
      <h2>Manage Income</h2>
      <form id="income-form">
        <input type="hidden" id="income-id" />
        <label for="income-amount">Amount:</label>
        <input type="number" id="income-amount" min="1" required />
        <button type="submit" id="add-btn">Add Income</button>
        <button
          type="button"
          id="update-btn"
          class="btn-secondary"
          style="display: none">
          Update Income
        </button>
        <button
          type="button"
          id="cancel-btn"
          class="btn-secondary"
          style="display: none">
          Cancel
        </button>
      </form>
      <div id="income-result" class="feedback"></div>
      <h3>All Incomes</h3>
      <div class="table-wrap">
        <table id="income-table">
          <thead>
            <tr>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <hr class="section-divider" />

      <h2>Add Expense</h2>
      <form id="expense-form">
        <input type="hidden" id="expense-id" />
        <label for="expense-amount">Amount:</label>
        <input type="number" id="expense-amount" min="1" required />
        <label for="expense-description">Description (optional):</label>
        <input type="text" id="expense-description" />
        <label for="expense-category">Category:</label>
        <select id="expense-category" required></select>
        <button type="submit" id="expense-add-btn">Add Expense</button>
        <button
          type="button"
          id="expense-update-btn"
          class="btn-secondary"
          style="display: none">
          Update Expense
        </button>
        <button
          type="button"
          id="expense-cancel-btn"
          class="btn-secondary"
          style="display: none">
          Cancel
        </button>
      </form>
      <div id="expense-result" class="feedback"></div>

      <hr class="section-divider" />

      <h3>All Expenses</h3>
      <div class="table-wrap">
        <table id="expenses-table">
          <thead>
            <tr>
              <th>Amount</th>
              <th>Description</th>
              <th>Current Category</th>
              <th>Assign Category</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="expense-category-result" class="feedback"></div>

      <hr class="section-divider" />

      <h3>Manage Categories</h3>
      <h4>Add New Category</h4>
      <div class="category-block">
        <label for="category-add-name">New Category Name:</label>
        <input type="text" id="category-add-name" />
        <label for="category-add-limit">Category Limit:</label>
        <input type="number" id="category-add-limit" min="0" />
        <button type="button" id="add-category-btn">Add Category</button>
      </div>

      <h4>Edit Existing Category</h4>
      <div class="category-block">
        <label for="category-manage-select">Select Existing Category:</label>
        <select id="category-manage-select"></select>
      </div>

      <div class="category-block">
        <label for="category-update-name">New Name for Selected:</label>
        <input type="text" id="category-update-name" />
        <label for="category-update-limit">New Limit for Selected:</label>
        <input type="number" id="category-update-limit" min="0" />
        <button type="button" id="update-category-btn" class="btn-secondary">
          Update Selected
        </button>
        <button type="button" id="delete-category-btn" class="btn-danger">
          Delete Selected
        </button>
      </div>

      <div id="category-result" class="feedback"></div>
    </main>
    <script>
      const form = document.getElementById("income-form");
      const amountInput = document.getElementById("income-amount");
      const idInput = document.getElementById("income-id");
      const resultDiv = document.getElementById("income-result");
      const updateBtn = document.getElementById("update-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const addBtn = document.getElementById("add-btn");
      const tableBody = document.querySelector("#income-table tbody");
      const expenseCategoryResultDiv = document.getElementById(
        "expense-category-result",
      );
      const expenseForm = document.getElementById("expense-form");
      const expenseIdInput = document.getElementById("expense-id");
      const expenseAmountInput = document.getElementById("expense-amount");
      const expenseDescriptionInput = document.getElementById(
        "expense-description",
      );
      const expenseCategoryInput = document.getElementById("expense-category");
      const expenseAddBtn = document.getElementById("expense-add-btn");
      const expenseUpdateBtn = document.getElementById("expense-update-btn");
      const expenseCancelBtn = document.getElementById("expense-cancel-btn");
      const expenseResultDiv = document.getElementById("expense-result");
      const expensesTableBody = document.querySelector("#expenses-table tbody");
      const categoryAddNameInput = document.getElementById("category-add-name");
      const categoryAddLimitInput =
        document.getElementById("category-add-limit");
      const categoryManageSelect = document.getElementById(
        "category-manage-select",
      );
      const categoryUpdateNameInput = document.getElementById(
        "category-update-name",
      );
      const categoryUpdateLimitInput = document.getElementById(
        "category-update-limit",
      );
      const addCategoryBtn = document.getElementById("add-category-btn");
      const updateCategoryBtn = document.getElementById("update-category-btn");
      const deleteCategoryBtn = document.getElementById("delete-category-btn");
      const categoryResultDiv = document.getElementById("category-result");
      let categories = [];

      async function fetchIncomes() {
        const resp = await fetch("/api/income");
        const incomes = await resp.json();
        renderIncomes(incomes);
      }

      async function fetchCategories() {
        const resp = await fetch("/api/categories");
        categories = await resp.json();
        renderManageCategoryOptions();
        renderExpenseCategoryOptions();
      }

      function renderExpenseCategoryOptions() {
        const previousValue = expenseCategoryInput.value;
        if (!categories.length) {
          expenseCategoryInput.innerHTML =
            '<option value="">No categories available</option>';
          return;
        }

        expenseCategoryInput.innerHTML = categories
          .map((category) => {
            const label = getCategoryLabel(category);
            return `<option value="${category.id}">${label}</option>`;
          })
          .join("");

        if (previousValue) {
          expenseCategoryInput.value = previousValue;
        }
      }

      function renderManageCategoryOptions() {
        const previousValue = categoryManageSelect.value;
        categoryManageSelect.innerHTML = "";

        if (!categories.length) {
          categoryManageSelect.innerHTML =
            '<option value="">No categories available</option>';
          return;
        }

        const options = categories
          .map((category) => {
            const label = getCategoryLabel(category);
            return `<option value="${category.id}">${label}</option>`;
          })
          .join("");

        categoryManageSelect.innerHTML = options;
        if (previousValue) {
          categoryManageSelect.value = previousValue;
        }

        prefillEditFieldsForSelectedCategory();
      }

      function prefillEditFieldsForSelectedCategory() {
        const id = parseInt(categoryManageSelect.value, 10);
        const selectedCategory = categories.find(
          (category) => Number(category.id) === Number(id),
        );

        if (!selectedCategory) {
          categoryUpdateNameInput.value = "";
          categoryUpdateLimitInput.value = "";
          return;
        }

        categoryUpdateNameInput.value = selectedCategory.name || "";
        if (selectedCategory.category_limit == null) {
          categoryUpdateLimitInput.value = "";
        } else {
          categoryUpdateLimitInput.value = selectedCategory.category_limit;
        }
      }

      async function extractErrorMessage(response, fallbackMessage) {
        try {
          const payload = await response.json();
          if (payload && payload.message) {
            return payload.message;
          }
        } catch (error) {
          // Ignore parse failures and use fallback message.
        }
        return fallbackMessage;
      }

      async function fetchExpenses() {
        const resp = await fetch("/api/expenses");
        const expenses = await resp.json();
        renderExpenses(expenses);
      }

      function getCategoryLabel(category) {
        return category.name || category.category || `Category ${category.id}`;
      }

      function getCategoryNameById(categoryId) {
        const matchedCategory = categories.find(
          (category) => Number(category.id) === Number(categoryId),
        );
        return matchedCategory ? getCategoryLabel(matchedCategory) : "-";
      }

      function renderExpenses(expenses) {
        expensesTableBody.innerHTML = "";

        expenses.forEach((expense) => {
          const tr = document.createElement("tr");
          const selectId = `category-select-${expense.id}`;

          const options = categories
            .map((category) => {
              const selected =
                Number(expense.category_id) === Number(category.id)
                  ? "selected"
                  : "";
              const label = getCategoryLabel(category);
              return `<option value="${category.id}" ${selected}>${label} </option>`;
            })
            .join("");

          const currentCategory = expense.category_id
            ? getCategoryNameById(expense.category_id)
            : "-";
          const safeDescription = String(expense.description ?? "").replaceAll(
            "'",
            "\\'",
          );
          tr.innerHTML = `
            <td>${expense.amount ?? "-"}</td>
            <td>${expense.description ?? ""}</td>
            <td>${currentCategory}</td>
            <td>
              <select id="${selectId}">${options}</select>
              <button class="btn-secondary" onclick="editExpense(${expense.id}, ${expense.amount ?? 0}, '${safeDescription}')">Edit</button>
              <button class="btn-secondary" onclick="assignCategoryFromRow(${expense.id}, '${selectId}')">Set</button>
              <button class="btn-danger" onclick="deleteExpense(${expense.id})">Delete</button>
            </td>`;

          expensesTableBody.appendChild(tr);
        });
      }

      function renderIncomes(incomes) {
        tableBody.innerHTML = "";
        incomes.forEach((income) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${income.amount}</td>
                        <td>
                            <button class="btn-secondary" onclick="editIncome(${income.id}, ${income.amount})">Edit</button>
                            <button class="btn-danger" onclick="deleteIncome(${income.id})">Delete</button>
                        </td>`;
          tableBody.appendChild(tr);
        });
      }

      function setExpenseFormMode(isEditing) {
        expenseAddBtn.style.display = isEditing ? "none" : "inline-block";
        expenseUpdateBtn.style.display = isEditing ? "inline-block" : "none";
        expenseCancelBtn.style.display = isEditing ? "inline-block" : "none";
      }

      function resetExpenseForm() {
        expenseIdInput.value = "";
        expenseAmountInput.value = "";
        expenseDescriptionInput.value = "";
        if (categories.length > 0) {
          expenseCategoryInput.value = String(categories[0].id);
        } else {
          expenseCategoryInput.value = "";
        }
        setExpenseFormMode(false);
      }

      window.editIncome = (id, amount) => {
        idInput.value = id;
        amountInput.value = amount;
        addBtn.style.display = "none";
        updateBtn.style.display = "inline-block";
        cancelBtn.style.display = "inline-block";
      };

      window.deleteIncome = async (id) => {
        if (!confirm("Delete this income?")) return;
        const resp = await fetch(`/api/income/${id}`, { method: "DELETE" });
        const deleted = await resp.json();
        resultDiv.textContent = deleted
          ? `Income #${id} deleted.`
          : `Delete failed.`;
        if (deleted) {
          if (idInput.value == id) {
            idInput.value = "";
            amountInput.value = "";
            addBtn.style.display = "inline-block";
            updateBtn.style.display = "none";
            cancelBtn.style.display = "none";
          }
          fetchIncomes();
        }
      };

      window.assignCategoryFromRow = async (expenseId, selectId) => {
        const select = document.getElementById(selectId);
        const categoryId = parseInt(select.value, 10);

        if (!categoryId || categoryId <= 0) {
          expenseCategoryResultDiv.textContent =
            "Please select a valid category.";
          return;
        }

        const resp = await fetch(
          `/api/expenses/${expenseId}/category/${categoryId}`,
          {
            method: "PUT",
          },
        );

        if (!resp.ok) {
          expenseCategoryResultDiv.textContent =
            "Failed to set category for expense.";
          return;
        }

        expenseCategoryResultDiv.textContent = `Expense #${expenseId} assigned to category #${categoryId}.`;
        await fetchExpenses();
      };

      window.editExpense = (id, amount, description) => {
        expenseIdInput.value = id;
        expenseAmountInput.value = amount;
        expenseDescriptionInput.value = description || "";
        setExpenseFormMode(true);
      };

      window.deleteExpense = async (id) => {
        if (!confirm("Delete this expense?")) return;
        const resp = await fetch(`/api/expenses/${id}`, { method: "DELETE" });
        const deleted = await resp.json();
        expenseResultDiv.textContent = deleted
          ? `Expense #${id} deleted.`
          : `Delete failed.`;
        if (deleted) {
          if (expenseIdInput.value == id) {
            resetExpenseForm();
          }
          fetchExpenses();
        }
      };

      expenseForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const amount = parseFloat(expenseAmountInput.value);
        if (!amount || amount <= 0) {
          expenseResultDiv.textContent = "Amount must be positive.";
          return;
        }

        const categoryId = parseInt(expenseCategoryInput.value, 10);
        if (!categoryId || categoryId <= 0) {
          expenseResultDiv.textContent = "Please select a valid category.";
          return;
        }

        const description = expenseDescriptionInput.value || "";
        const expenseId = expenseIdInput.value;
        const response = expenseId
          ? await fetch(`/api/expenses/${expenseId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ amount, description }),
            })
          : await fetch("/api/expenses", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ amount, description, categoryId }),
            });

        if (!response.ok) {
          expenseResultDiv.textContent = expenseId
            ? "Could not update expense."
            : "Could not add expense.";
          return;
        }

        if (expenseId) {
          const updated = await response.json();
          expenseResultDiv.textContent = updated
            ? `Expense #${expenseId} updated.`
            : "Update failed.";
        } else {
          const id = await response.json();
          expenseResultDiv.textContent = `Expense added with id ${id}.`;
        }

        resetExpenseForm();
        await fetchExpenses();
      });

      expenseUpdateBtn.addEventListener("click", () => {
        expenseForm.dispatchEvent(new Event("submit"));
      });

      expenseCancelBtn.addEventListener("click", () => {
        resetExpenseForm();
      });

      addCategoryBtn.addEventListener("click", async () => {
        const name = categoryAddNameInput.value.trim();
        const limitValue = categoryAddLimitInput.value;
        const parsedLimit =
          limitValue === "" ? null : parseFloat(categoryAddLimitInput.value);

        if (!name) {
          categoryResultDiv.textContent = "Please enter a category name.";
          return;
        }

        if (
          parsedLimit !== null &&
          (Number.isNaN(parsedLimit) || parsedLimit < 0)
        ) {
          categoryResultDiv.textContent =
            "Please enter a valid category limit (0 or greater).";
          return;
        }

        const payload = { name };
        if (parsedLimit !== null) {
          payload.category_limit = parsedLimit;
        }

        const response = await fetch("/api/categories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          categoryResultDiv.textContent = await extractErrorMessage(
            response,
            "Could not add category.",
          );
          return;
        }

        const id = await response.json();
        categoryResultDiv.textContent = `Category added with id ${id}.`;
        categoryAddNameInput.value = "";
        categoryAddLimitInput.value = "";
        await fetchCategories();
        await fetchExpenses();
      });

      updateCategoryBtn.addEventListener("click", async () => {
        const id = parseInt(categoryManageSelect.value, 10);
        const nameInput = categoryUpdateNameInput.value.trim();
        const limitValue = categoryUpdateLimitInput.value;
        const parsedLimit =
          limitValue === "" ? null : parseFloat(categoryUpdateLimitInput.value);
        const name = nameInput;

        if (!id || id <= 0) {
          categoryResultDiv.textContent = "Please choose a valid category.";
          return;
        }

        if (!name) {
          categoryResultDiv.textContent = "Please enter a new category name.";
          return;
        }

        if (
          parsedLimit !== null &&
          (Number.isNaN(parsedLimit) || parsedLimit < 0)
        ) {
          categoryResultDiv.textContent =
            "Please enter a valid category limit (0 or greater).";
          return;
        }

        const payload = { name };
        if (parsedLimit !== null) {
          payload.category_limit = parsedLimit;
        }

        const response = await fetch(`/api/categories/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          categoryResultDiv.textContent = await extractErrorMessage(
            response,
            "Could not update category.",
          );
          return;
        }

        categoryResultDiv.textContent = "Category updated.";
        categoryUpdateNameInput.value = "";
        categoryUpdateLimitInput.value = "";
        await fetchCategories();
        await fetchExpenses();
      });

      deleteCategoryBtn.addEventListener("click", async () => {
        const id = parseInt(categoryManageSelect.value, 10);

        if (!id || id <= 0) {
          categoryResultDiv.textContent = "Please choose a valid category.";
          return;
        }

        if (!confirm("Delete selected category?")) {
          return;
        }

        const response = await fetch(`/api/categories/${id}`, {
          method: "DELETE",
        });

        if (!response.ok) {
          categoryResultDiv.textContent = await extractErrorMessage(
            response,
            "Could not delete category.",
          );
          return;
        }

        categoryResultDiv.textContent = "Category deleted.";
        categoryUpdateNameInput.value = "";
        categoryUpdateLimitInput.value = "";
        await fetchCategories();
        await fetchExpenses();
      });

      categoryManageSelect.addEventListener("change", () => {
        prefillEditFieldsForSelectedCategory();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const amount = parseFloat(amountInput.value);
        if (!amount || amount <= 0) {
          resultDiv.textContent = "Amount must be positive.";
          return;
        }
        const id = idInput.value;
        if (id) {
          // Update
          const resp = await fetch(`/api/income/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ amount }),
          });
          const updated = await resp.json();
          resultDiv.textContent = updated
            ? `Income #${id} updated.`
            : `Update failed.`;
          if (updated) {
            idInput.value = "";
            amountInput.value = "";
            addBtn.style.display = "inline-block";
            updateBtn.style.display = "none";
            cancelBtn.style.display = "none";
            fetchIncomes();
          }
        } else {
          // Add
          const resp = await fetch("/api/income", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ amount }),
          });
          const newId = await resp.json();
          resultDiv.textContent = `Income added with id ${newId}.`;
          idInput.value = "";
          amountInput.value = "";
          fetchIncomes();
        }
      });

      updateBtn.addEventListener("click", () => {
        form.dispatchEvent(new Event("submit"));
      });

      cancelBtn.addEventListener("click", () => {
        idInput.value = "";
        amountInput.value = "";
        addBtn.style.display = "inline-block";
        updateBtn.style.display = "none";
        cancelBtn.style.display = "none";
      });

      async function initializePage() {
        await fetchIncomes();
        await fetchCategories();
        await fetchExpenses();
      }

      initializePage();
    </script>
  </body>
</html>
